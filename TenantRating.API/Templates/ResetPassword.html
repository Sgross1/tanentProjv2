<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Rajdhani:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Rubik", Arial, sans-serif;
        background: #f5f8fc;
        color: #2d3436;
      }

      .shell {
        padding: 36px 12px;
        background: #f5f8fc;
      }

      .frame {
        max-width: 620px;
        margin: 0 auto;
        padding: 1px;
        border-radius: 16px;
        background: linear-gradient(135deg, #2d7ef7 0%, #002f6c 100%);
      }

      .card {
        background: #ffffff;
        border-radius: 15px;
        overflow: hidden;
      }

      .header {
        text-align: center;
        padding: 30px 18px 24px;
        border-bottom: 1px solid #edf2f7;
      }

      .logo {
        margin: 0;
        font-family: "Rubik", Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: 0.2px;
        line-height: 1;
        color: #2d7ef7;
        background: linear-gradient(135deg, #2d7ef7 0%, #002f6c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .content {
        padding: 30px 24px 26px;
        text-align: right;
      }

      .title {
        margin: 0 0 10px;
        font-size: 25px;
        font-weight: 800;
        color: #1f2d3d;
      }

      .greeting {
        margin: 0 0 10px;
        font-size: 17px;
        color: #2d3436;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 18px;
        line-height: 1.55;
        color: #5f6b7a;
      }

      .cta-wrap {
        text-align: center;
        margin: 22px 0 18px;
      }

      .button {
        display: inline-block;
        text-decoration: none;
        color: #ffffff !important;
        background-color: #2d7ef7;
        background-image: linear-gradient(135deg, #0984e3 0%, #00cec9 100%);
        padding: 13px 36px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 700;
      }

      .token-box {
        margin: 0 0 16px;
        background: #f8fbff;
        border: 1px solid #dde9f8;
        border-radius: 12px;
        padding: 12px 14px;
        color: #425167;
      }

      .token-value {
        font-weight: 800;
        color: #2d7ef7;
      }

      .note {
        margin: 0;
        color: #7a8799;
        font-size: 13px;
        line-height: 1.6;
      }

      .footer {
        border-top: 1px solid #edf2f7;
        background: #fbfcfe;
        text-align: center;
        padding: 14px 16px;
        color: #9aa5b3;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="frame">
        <div class="card">
          <div class="header">
            <h1 class="logo">KaLiScore</h1>
          </div>

          <div class="content">
            <h2 class="title">איפוס סיסמה</h2>
            <p class="greeting">שלום {recipientName},</p>
            <p class="subtitle">
              קיבלנו בקשה לאיפוס הסיסמה שלך. כדי לבחור סיסמה חדשה, לחץ על הכפתור
              הבא.
            </p>

            <div class="cta-wrap">
              <a href="{resetLink}" class="button">בחירת סיסמה חדשה</a>
            </div>

            <div class="token-box">
              קוד אימות: <span class="token-value">{token}</span>
            </div>

            <p class="note">
              הקישור תקף ל־15 דקות. אם לא ביקשת לאפס סיסמה, אפשר להתעלם מהודעה
              זו בבטחה.
            </p>
          </div>

          <div class="footer">&copy; 2026 KaLiScore. כל הזכויות שמורות.</div>
        </div>
      </div>
    </div>
  </body>
</html>
