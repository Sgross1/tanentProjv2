<div class="reset-container">
  <div class="card reset-card" *ngIf="token; else noToken">
    <div class="reset-header">
      <h2>איפוס סיסמה</h2>
      <p>בחר סיסמה חדשה לחשבון שלך.</p>
    </div>

    <div class="inline-message" *ngIf="uiMessage" [class.error]="uiMessageType === 'error'"
      [class.success]="uiMessageType === 'success'">
      {{ uiMessage }}
    </div>

    <form class="reset-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="newPassword">סיסמה חדשה</label>
        <div class="password-wrapper">
          <input id="newPassword" [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword"
            placeholder="סיסמה חדשה (מינימום 6 תווים)" />
          <button type="button" class="toggle-password" (click)="toggleNewPasswordVisibility()"
            [title]="showNewPassword ? 'הסתר סיסמה' : 'הצג סיסמה'">
            <svg *ngIf="!showNewPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showNewPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
              </path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="error" *ngIf="
            resetForm.get('newPassword')?.touched &&
            resetForm.get('newPassword')?.errors?.['minlength']
          ">
          הסיסמה חייבת להכיל לפחות 6 תווים
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">אימות סיסמה</label>
        <div class="password-wrapper">
          <input id="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword" placeholder="אמת סיסמה חדשה" />
          <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()"
            [title]="showConfirmPassword ? 'הסתר סיסמה' : 'הצג סיסמה'">
            <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
              </path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="error" *ngIf="
            resetForm.errors?.['mismatch'] &&
            resetForm.get('confirmPassword')?.touched
          ">
          הסיסמאות אינן תואמות
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="!isLoading">שמור סיסמה חדשה</span>
        <span *ngIf="isLoading">מעדכן...</span>
      </button>
    </form>
  </div>

  <ng-template #noToken>
    <div class="card reset-card error-card">
      <h2>שגיאה</h2>
      <p>קישור איפוס לא תקין או שחסר טוקן.</p>
      <a routerLink="/" class="btn-link">חזרה לדף הבית</a>
    </div>
  </ng-template>
</div>
