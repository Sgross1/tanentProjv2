<!-- REFINED NAVBAR -->
<nav class="navbar-refined">
  <!-- Right side: Logo -->
  <div class="logo-side">
    <div class="logo" routerLink="/">KaLiScore</div>
  </div>

  <!-- Center side: Navigation Pill -->
  <div class="nav-center">
    <div class="nav-pill" [class.mobile-active]="isMenuOpen">
      <a routerLink="/" fragment="how-it-works" class="nav-pill-item"
        >איך זה עובד</a
      >
      <a routerLink="/" fragment="about" class="nav-pill-item">אודות</a>
      <a routerLink="/" fragment="faq" class="nav-pill-item">שאלות נפוצות</a>
      <a routerLink="/" fragment="contact" class="nav-pill-item">צור קשר</a>

      <ng-container *ngIf="authService.currentUser$ | async as user">
        <!--מיותרת ngIf לכאורה השורה  -->

        <a
          routerLink="/tenant/dashboard"
          *ngIf="user.role !== 'Admin'"
          class="nav-pill-item mobile-account-link"
          >איזור אישי</a
        >
        <a
          routerLink="/admin"
          *ngIf="user.role === 'Admin'"
          class="nav-pill-item mobile-account-link"
          >ניהול מערכת</a
        >
      </ng-container>
    </div>

    <!-- Hamburger Button (Mobile Only) -->
    <div class="hamburger-wrapper" (click)="toggleMenu()">
      <div class="hamburger" [class.active]="isMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <!-- Left side: Auth -->
  <div class="auth-side">
    <div
      class="restricted-links"
      *ngIf="authService.currentUser$ | async as user"
    >
      <a
        routerLink="/tenant/dashboard"
        *ngIf="user.role !== 'Admin'"
        class="secondary-link personal-area-link"
        >איזור אישי</a
      >

      <a
        routerLink="/admin"
        *ngIf="user.role === 'Admin'"
        class="secondary-link admin-link"
        >ניהול מערכת</a
      >
    </div>

    <div class="auth-buttons">
      <ng-container
        *ngIf="authService.currentUser$ | async as user; else loginButton"
      >
        <span class="user-greeting">שלום, {{ user.firstName }}</span>
        <button (click)="logout()" class="logout-btn">התנתק</button>
      </ng-container>
      <ng-template #loginButton>
        <button (click)="openAuth()" class="login-btn">התחברות / הרשמה</button>
      </ng-template>
    </div>
  </div>
</nav>

<div class="menu-backdrop" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

<app-auth-modal
  *ngIf="showAuthModal"
  (closeEvent)="closeAuth()"
></app-auth-modal>

<div class="container" style="padding: 2rem; padding-top: 90px">
  <!-- Main Content -->
  <router-outlet></router-outlet>
</div>
